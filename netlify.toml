# Netlify — apps/web (static Vite SPA) and apps/embed assets
# Placeholder from T-001. Full wiring (redirects, headers, previews) lands in T-012.

[build]
  command = "pnpm --filter @local-matrix/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

